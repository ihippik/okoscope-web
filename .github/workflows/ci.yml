name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:e2e
      - run: docker build --build-arg OKOSCOPE_WEB_GIT_COMMIT=${{ github.sha }} -t okoscope-web:smoke .
      - run: ./scripts/container-smoke.sh okoscope-web:smoke
